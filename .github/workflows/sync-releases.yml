name: Sync Release Notes

# Syncs MOS release notes from mos-nas/mos-releases into the docs and commits
# them. The deploy itself is handled by deploy.yml (triggered by the push).
on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. 0.6.2-stable). Leave empty for all.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sync-release-notes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sync release notes
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          ARGS=""
          if [ -n "$TAG" ]; then ARGS="--tag $TAG"; fi
          if [ "$EVENT_NAME" = "schedule" ]; then TRIGGER="schedule"; else TRIGGER="manual"; fi
          node scripts/sync-releases.js $ARGS --trigger "$TRIGGER"
          if [ -n "$(git status --porcelain -- release-index.json release-announcement.json release-sync.json docs/Release-Notes)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Release notes changed — will commit."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No release-note changes detected."
          fi

      - name: Commit synced release notes
        if: steps.sync.outputs.changed == 'true'
        run: |
          STAMP="$(TZ=Europe/Vienna date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-index.json release-announcement.json release-sync.json docs/Release-Notes
          git commit -m "chore(release-notes): auto-sync release notes ($STAMP)"
          git pull --rebase origin master
          git push
