name: Sync OpenAPI Reference

# Regenerates src/components/ApiExplorer/openapi.json from the mos-api
# repository and commits it when the spec actually changed. The deploy itself
# is handled by deploy.yml (triggered by the push).
on:
  schedule:
    # Sundays 21:00 UTC (22:00/23:00 Europe/Vienna depending on DST)
    - cron: '0 21 * * 0'
  workflow_dispatch:
    inputs:
      ref:
        description: 'mos-api git ref (branch / tag / sha)'
        required: false
        default: 'master'

permissions:
  contents: write

concurrency:
  group: sync-openapi
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sync OpenAPI spec
        id: sync
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          REF="${{ github.event.inputs.ref || 'master' }}"
          if [ "$EVENT_NAME" = "schedule" ]; then TRIGGER="schedule"; else TRIGGER="manual"; fi
          echo "Using mos-api ref: $REF (trigger: $TRIGGER)"
          node scripts/sync-openapi.js --ref "$REF" --trigger "$TRIGGER"
          if [ -n "$(git status --porcelain -- src/components/ApiExplorer/openapi.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Spec changed — will commit."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No spec changes detected."
          fi

      - name: Commit synced spec
        if: steps.sync.outputs.changed == 'true'
        run: |
          STAMP="$(TZ=Europe/Vienna date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ApiExplorer/openapi.json
          git commit -m "chore(api): auto-sync openapi.json ($STAMP)"
          git pull --rebase origin master
          git push
